# Eval runs only (README.md's Evals section): `docker compose run --rm
# precis eval ...`. Consumers run the image with their own `docker run`
# and mounts; the separate precis:eval tag keeps eval builds — which may
# carry uncommitted prompt changes — off the `precis` image they use.
services:
  precis:
    build: .
    image: precis:eval
    env_file: .env
    # README.md's recommended hardening.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    pids_limit: 256
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ./evals:/evals
      - precis-data:/data

volumes:
  precis-data:
    # The same named volume the README's `docker run` commands use, so eval
    # runs and generate share one research cache.
    name: precis-data
