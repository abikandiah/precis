[project]
name = "precis"
version = "0.1.0"
description = "Known-file (ISBN + chapters) in, validated book JSON out — standalone AI generation module."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-core",
    "openai",
    "tavily-python",
]

[project.scripts]
precis = "precis.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precis"]

[[tool.mypy.overrides]]
module = "tavily.*"
ignore_missing_imports = true
